<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla de certificado de ejemplo — A4 horizontal (1123 x 794 px a 96 DPI)
  Campos reemplazables (atributo data-field):
    nombre, curso, horas, fecha, instructor, director, codigo
  Sustituye el texto {{CAMPO}} por el valor real. Para usarla con jsPDF,
  rasterízala a PNG o conviértela con svg2pdf; si necesitas texto nativo en
  el PDF, dibuja los campos con jsPDF encima de la imagen de fondo.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1123" height="794" viewBox="0 0 1123 794"
     role="img" aria-labelledby="titulo descripcion">

  <title id="titulo">Plantilla de certificado de ejemplo</title>
  <desc id="descripcion">Certificado horizontal con marco dorado, emblema, nombre, curso, firmas y sello. Los textos entre llaves son campos de ejemplo.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.55" stop-color="#fdf9ef"/>
      <stop offset="1" stop-color="#f6eeda"/>
    </linearGradient>

    <radialGradient id="brillo" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6d29a"/>
      <stop offset="0.35" stop-color="#c2a251"/>
      <stop offset="0.6" stop-color="#f0e0ad"/>
      <stop offset="1" stop-color="#a9853a"/>
    </linearGradient>

    <linearGradient id="oroLinea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2a251" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c2a251"/>
      <stop offset="1" stop-color="#c2a251" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sello" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f5e7bd"/>
      <stop offset="0.7" stop-color="#d9bd74"/>
      <stop offset="1" stop-color="#b2913f"/>
    </radialGradient>

    <pattern id="trama" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#c2a251" opacity="0.16"/>
    </pattern>

    <!-- Esquina decorativa reutilizable; se refleja en las cuatro esquinas -->
    <g id="esquina" fill="none" stroke="#c2a251">
      <path d="M0 54 L0 0 L54 0" stroke-width="2"/>
      <path d="M9 42 L9 9 L42 9" stroke-width="1" opacity="0.65"/>
      <path d="M0 0 L12 12" stroke-width="1" opacity="0.5"/>
      <path d="M9 9 l6 6 l-6 6 l-6 -6 Z" fill="#c2a251" stroke="none" opacity="0.9"/>
      <circle cx="30" cy="0" r="2" fill="#c2a251" stroke="none" opacity="0.7"/>
      <circle cx="0" cy="30" r="2" fill="#c2a251" stroke="none" opacity="0.7"/>
    </g>
  </defs>

  <!-- Fondo -->
  <rect width="1123" height="794" fill="url(#fondo)"/>
  <rect width="1123" height="794" fill="url(#brillo)"/>

  <!-- Marco -->
  <rect x="26" y="26" width="1071" height="742" fill="none" stroke="url(#oro)" stroke-width="3"/>
  <rect x="27.5" y="27.5" width="1068" height="739" fill="none" stroke="#e8d9ae" stroke-width="1"/>
  <rect x="40" y="40" width="1043" height="714" fill="url(#trama)" opacity="0.35"/>
  <rect x="40" y="40" width="1043" height="714" fill="none" stroke="#c2a251" stroke-width="1" opacity="0.55"/>

  <!-- Esquinas -->
  <use href="#esquina" x="40" y="40"/>
  <use href="#esquina" transform="translate(1083 40) scale(-1 1)"/>
  <use href="#esquina" transform="translate(40 754) scale(1 -1)"/>
  <use href="#esquina" transform="translate(1083 754) scale(-1 -1)"/>

  <!-- Emblema superior -->
  <g transform="translate(561.5 116)">
    <circle r="38" fill="none" stroke="url(#oro)" stroke-width="2"/>
    <circle r="31" fill="#fffaf0" stroke="#c2a251" stroke-width="1" opacity="0.95"/>
    <circle r="26" fill="none" stroke="#c2a251" stroke-width="0.8" opacity="0.5"/>
    <path d="M0 -17 L4 -5.5 L16.2 -5.3 L6.5 2.1 L10 13.8 L0 6.8 L-10 13.8 L-6.5 2.1 L-16.2 -5.3 L-4 -5.5 Z"
          fill="url(#oro)" stroke="#a9853a" stroke-width="0.8"/>
    <g stroke="#c2a251" stroke-width="1" opacity="0.7">
      <line x1="-58" y1="0" x2="-44" y2="0"/>
      <line x1="44" y1="0" x2="58" y2="0"/>
      <path d="M-52 0 l3 -3 l3 3 l-3 3 Z" fill="#c2a251" stroke="none"/>
      <path d="M52 0 l-3 -3 l-3 3 l3 3 Z" fill="#c2a251" stroke="none"/>
    </g>
  </g>

  <!-- Título -->
  <text x="561.5" y="240" text-anchor="middle" dx="-6"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="50" letter-spacing="12" font-weight="bold"
        fill="#1b2a4a">CERTIFICADO</text>

  <text x="561.5" y="272" text-anchor="middle" dx="-3.5"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" letter-spacing="7" fill="#a9853a">DE RECONOCIMIENTO</text>

  <g stroke="url(#oroLinea)" stroke-width="1.2">
    <line x1="452" y1="296" x2="671" y2="296"/>
  </g>
  <path d="M561.5 291 l4.5 5 l-4.5 5 l-4.5 -5 Z" fill="#c2a251"/>

  <!-- Cuerpo -->
  <text x="561.5" y="352" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="16" fill="#6f6a63">Se otorga el presente reconocimiento a</text>

  <text x="561.5" y="425" text-anchor="middle" data-field="nombre"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="54" letter-spacing="1" fill="#14213d">{{NOMBRE}}</text>

  <g stroke="url(#oroLinea)" stroke-width="1.4">
    <line x1="250" y1="455" x2="873" y2="455"/>
  </g>
  <path d="M561.5 449.5 l5.5 5.5 l-5.5 5.5 l-5.5 -5.5 Z" fill="#c2a251"/>
  <circle cx="250" cy="455" r="2.4" fill="#c2a251"/>
  <circle cx="873" cy="455" r="2.4" fill="#c2a251"/>

  <text x="561.5" y="505" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#6f6a63">por haber completado satisfactoriamente el curso</text>

  <text x="561.5" y="552" text-anchor="middle" data-field="curso"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="29" letter-spacing="1.5" fill="#14213d">{{CURSO}}</text>

  <text x="561.5" y="588" text-anchor="middle" data-field="horas"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" letter-spacing="2" fill="#8a8278">DURACIÓN: {{HORAS}} HORAS</text>

  <!-- Firmas -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle" fill="#6f6a63">
    <g stroke="#b8ad9c" stroke-width="1">
      <line x1="195" y1="672" x2="405" y2="672"/>
      <line x1="718" y1="672" x2="928" y2="672"/>
    </g>
    <text x="300" y="696" data-field="instructor" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1b2a4a">{{INSTRUCTOR}}</text>
    <text x="300" y="715" font-size="10.5" letter-spacing="2" fill="#8a8278">INSTRUCTOR</text>
    <text x="823" y="696" data-field="director" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1b2a4a">{{DIRECTOR}}</text>
    <text x="823" y="715" font-size="10.5" letter-spacing="2" fill="#8a8278">DIRECTOR ACADÉMICO</text>
  </g>

  <!-- Sello central -->
  <g transform="translate(561.5 654)">
    <path d="M-22 12 L-34 66 L-16 58 L-6 72 L2 18 Z" fill="#b2913f" opacity="0.9"/>
    <path d="M22 12 L34 66 L16 58 L6 72 L-2 18 Z" fill="#a9853a" opacity="0.9"/>
    <circle r="33" fill="url(#sello)" stroke="#8c6d2f" stroke-width="2"/>
    <circle r="27" fill="none" stroke="#fffaf0" stroke-width="1" opacity="0.8" stroke-dasharray="2 3"/>
    <path d="M0 -15 L3.5 -4.8 L14.3 -4.6 L5.7 1.9 L8.8 12.2 L0 6 L-8.8 12.2 L-5.7 1.9 L-14.3 -4.6 L-3.5 -4.8 Z"
          fill="#fffaf0" opacity="0.92"/>
  </g>

  <!-- Pie -->
  <text x="561.5" y="742" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11" letter-spacing="1.5" fill="#8a8278">
    Emitido el <tspan data-field="fecha" fill="#6f6a63">{{FECHA}}</tspan>
    <tspan fill="#c2a251"> · </tspan>
    Código <tspan data-field="codigo" fill="#6f6a63">{{CODIGO}}</tspan>
  </text>
</svg>
