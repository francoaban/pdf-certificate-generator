<?xml version="1.0" encoding="UTF-8"?>
<!-- Fondo para el estilo "Botánico". Sin texto: los datos se dibujan con jsPDF. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794" role="img" aria-label="Fondo de certificado botánico con hojas de salvia">
  <defs>
