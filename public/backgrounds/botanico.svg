      <use href="#hoja" transform="translate(74 148) rotate(-38) scale(0.72)"/>
      <use href="#hoja" transform="translate(112 120) rotate(-56) scale(0.8)"/>
      <use href="#hoja" transform="translate(162 100) rotate(-72) scale(0.85)"/>
      <use href="#hoja" transform="translate(214 86) rotate(-86) scale(0.75)"/>
      <use href="#hoja" transform="translate(98 108) rotate(15) scale(0.55)"/>
      <use href="#hoja" transform="translate(150 92) rotate(-8) scale(0.6)"/>
    </g>
  </defs>

  <rect width="1123" height="794" fill="url(#fondo)"/>
  <ellipse cx="70" cy="60" rx="180" ry="150" fill="#dfe7d2" opacity="0.55" filter="url(#difuso)"/>
  <ellipse cx="1060" cy="740" rx="200" ry="160" fill="#e4ead9" opacity="0.5" filter="url(#difuso)"/>
  <ellipse cx="1080" cy="60" rx="140" ry="120" fill="#e9eedf" opacity="0.4" filter="url(#difuso)"/>

  <rect x="34" y="34" width="1055" height="726" fill="none" stroke="#a9b798" stroke-width="1.4"/>
  <rect x="42" y="42" width="1039" height="710" fill="none" stroke="#c4cfb5" stroke-width="0.8"/>

  <use href="#ramita" opacity="0.28"/>
